name: Publish to MCP Registry

# Triggers:
#   1. Push to main that modifies server.json    → republish immediately
#   2. Manual dispatch                           → republish on demand
#
# OIDC authentication — no long-lived secrets. The MCP Registry accepts
# GitHub's short-lived OIDC token (scoped to this repo) as proof of ownership
# of the io.github.SezerPro/* namespace.
on:
  push:
    branches: [main]
    paths: ["server.json"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication to the MCP Registry
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Summary
        if: always()
        run: |
          echo "### MCP Registry publish result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Server: \`io.github.SezerPro/fichepro-mcp\`" >> $GITHUB_STEP_SUMMARY
          echo "- Version: \`$(jq -r .version server.json)\`" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: https://registry.modelcontextprotocol.io/v0.1/servers?search=fichepro" >> $GITHUB_STEP_SUMMARY
